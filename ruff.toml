# Shared by backend/ and mcp/. Formatting follows ruff's defaults (88 columns);
# the lint rules are the ones that catch real problems without rewriting style.
target-version = "py312"
line-length = 88

[lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF100"]
ignore = [
    # FastAPI's `Depends(...)` and `Query(...)` in argument defaults is the idiom.
    "B008",
    # These enums mix in `str` on purpose. StrEnum would change what
    # `str(member)` returns, which the API and stored values depend on.
    "UP042",
]
