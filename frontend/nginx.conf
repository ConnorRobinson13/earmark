# One origin for the whole app: the built SPA at `/`, the API under `/api`.
#
# `src/api.js` falls back to `/api` whenever VITE_API_URL is unset, and the Vite
# dev proxy strips that prefix before forwarding to the backend. This file
# reproduces the same rewrite in production, so one bundle works in both places
# and no build has to be told the deployment's hostname.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;


    # CSV history imports and bulk categorisation both post bodies larger than
    # nginx's 1m default, and the failure is a 413 the UI reports as a generic
    # network error.
    client_max_body_size 16m;

    # Matches `/api/...` and a bare `/api`. A prefix location of `/api/` misses
    # the bare form, which would then fall through to the SPA fallback and
    # answer an API call with the index page — a 200 full of HTML, which is a
    # far more confusing failure than a 404.
    location ~ ^/api(/|$) {
        # Resolve the backend per-request through Docker's embedded DNS rather
        # than once at startup. With a literal hostname nginx refuses to start
        # at all if the name does not resolve yet ("host not found in
        # upstream"), so a backend that is down for a moment — a rebuild, a
        # restart — takes the entire web tier with it, and
        # `restart: unless-stopped` turns that into a crash loop. Resolving
        # late means the app still serves, and a dead backend is a 502 on the
        # API calls instead of a blank site.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $earmark_backend "backend:8000";

        # Strips the `/api` prefix, matching the Vite dev proxy's rewrite.
        # proxy_pass cannot carry a URI part when its target is a variable, so
        # the rewrite does that job explicitly. Query strings are preserved.
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass http://$earmark_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # tailscale serve terminates TLS in front of us, so the backend would
        # otherwise see plain http and build wrong absolute URLs.
        proxy_set_header X-Forwarded-Proto https;
        # A manual Plaid sync walks every linked account; 60s is not enough.
        proxy_read_timeout 300s;
    }

    # The service worker must never be served from cache. `registerType:
    # autoUpdate` can only ship a new build if the browser can see that this
    # file changed — revalidating against a cached copy of the thing that
    # announces updates is how a PWA pins itself to an old version forever.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # nginx's bundled mime.types has no entry for .webmanifest, so the manifest
    # would go out as application/octet-stream and a browser is within its
    # rights to ignore it — costing the install prompt and the standalone
    # display this app is built for. Overridden here rather than with a `types`
    # block, which would replace the inherited map wholesale and take the
    # content type of every stylesheet and script with it.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # Vite fingerprints everything under /assets, so these are safe to pin.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — react-router owns every path that isn't a real file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
